name: App Builder
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master
      - HSF-and-new-algos-feature-branch

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ env.GITHUB_TOKEN }}
          # The overlay/ submodule carries the prebuilt calibration overlay.
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.14"
      - name: Setup Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached wheels
        id: cached-pip-wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      #----------------------------------------------
      #       load cached venv if cache exists
      #----------------------------------------------
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install python dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install Linux dependencies
        if: ${{ matrix.os == 'ubuntu-latest'}}
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget libssl-dev xvfb

      - name: Contribution security and integration tests
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a poetry run python -m pytest --confcutdir=tests/contributions tests/contributions -q
          else
            poetry run python -m pytest --confcutdir=tests/contributions tests/contributions -q
          fi

      - name: Build Windows App
        if: ${{ matrix.os == 'windows-latest' }}
        working-directory: EyeTrackApp
        run: poetry run pyinstaller --noconfirm --distpath ../dist eyetrackapp.spec

      - name: Build Linux App
        if: ${{ matrix.os == 'ubuntu-latest' }}
        working-directory: EyeTrackApp
        run: poetry run pyinstaller --noconfirm --distpath ../build/linux-release eyetrackapp_linux.spec

      - name: Package Linux runtime and resources
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          mkdir -p dist
          tar -czf dist/EyeTrackVR-linux.tar.gz -C build/linux-release EyeTrackVR

      - uses: actions/upload-artifact@v4
        with:
          name: production-files-${{ matrix.os }}
          path: dist
          if-no-files-found: error
  build-frame:
    name: Build Steam Frame (arm64)
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The overlay/ submodule carries the prebuilt calibration overlay.
          submodules: true
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' scripts/frame/apt-packages.txt | xargs sudo apt-get install -y -qq --no-install-recommends
      - name: Build Steam Frame zip and FrameDrop manifest
        run: |
          VERSION="$(tr -d '\r\n' < version.txt)"
          SAFE_VERSION="$(printf '%s' "$VERSION" | sed -E 's/[^A-Za-z0-9.+_-]+/-/g')"
          bash scripts/build_frame.sh "$VERSION" "$SAFE_VERSION" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: production-files-steamframe
          path: dist
          if-no-files-found: error
  deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: Deploy
    needs: [build, build-frame]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create Directory
        run: mkdir -p dist
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          pattern: production-files-*
          merge-multiple: true
          path: ./dist
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install -g conventional-changelog-conventionalcommits@6
      - run: npm install -g semantic-release@v19.0.5
      - run: npm install -g @semantic-release/exec
      - run: npm install -g @semantic-release/git
      - run: npm install -g @semantic-release/release-notes-generator
      - run: npm install -g @semantic-release/changelog
      - run: npm install -g @semantic-release/github
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./.github/scripts/prepareCMD.sh
          semantic-release

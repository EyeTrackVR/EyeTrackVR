name: Tests
on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Fork PRs run with a read-only token and no secrets; never switch this to pull_request_target.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.14"

      - name: Setup Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: tests-venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libglib2.0-0

      - name: Install python dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      # Tk-based tests need a display on Linux.
      - name: App tests
        run: |
          run=""
          if [[ "$RUNNER_OS" == "Linux" ]]; then run="xvfb-run -a"; fi
          $run poetry run python -m pytest tests --ignore=tests/contributions

      - name: Contribution tests
        run: |
          run=""
          if [[ "$RUNNER_OS" == "Linux" ]]; then run="xvfb-run -a"; fi
          $run poetry run python -m pytest --confcutdir=tests/contributions tests/contributions

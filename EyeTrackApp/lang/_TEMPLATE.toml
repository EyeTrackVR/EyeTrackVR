# ============================================================================
# EyeTrackVR: Language file TEMPLATE
# ============================================================================
# Want EyeTrackVR in your language? You do NOT need to touch any code.
#
#   1. Copy this file and rename it to your locale code + ".toml"
#      (e.g. German -> de.toml, Japanese -> ja.toml, French -> fr.toml).
#      Common codes: de, ja, zh, fr, ko, pt, ru, it, nl, pl. Use whatever
#      short code you like; it's just the filename and the [meta].code below.
#
#   2. Fill in the [meta] block: your locale code, the English name of the
#      language, and its native name (this native name is what shows up in the
#      Settings > Language dropdown).
#
#   3. Translate the VALUE (the text in quotes) on the right of every `=`.
#      The `# EN: "..."` comment above each line shows the original English so
#      you know what you are translating. Leaving a value as "" (empty) is fine:
#      the app falls back to English for any key you skip, so you can ship a
#      partial translation and finish it later.
#
#   4. Drop your finished file into this lang/ folder and relaunch EyeTrackVR.
#      Your language now appears in the Settings > Language dropdown. Pick it
#      and restart to apply. That's it: no code changes.
#
# IMPORTANT RULES
# ---------------------------------------------------------------------------
#   * NEVER change the key names (the text on the LEFT of `=`) or the section
#     headers in [brackets]. The app looks strings up by those exact names.
#   * KEEP every {placeholder} exactly as written (e.g. {value}, {error},
#     {current}, {total}). At runtime the app substitutes real values into
#     them. You may move a placeholder within the sentence to fit your grammar,
#     but do not rename or delete it.
#   * DO NOT translate product / proper names. Leave these verbatim:
#       EyeTrackVR, ETVR, NEXT, LEAP, HSF, HSRAC, RANSAC, RANSAC 3D, DADDY,
#       AHSF, AHRAC, BSB, TOBII, DFR, SteamVR, VRChat, VRCFT, VRCFaceTracking,
#       OpenVR, UVC, COM, OSC, GPU, CPU, Discord, URL, IP, mDNS, One Euro,
#       and any /avatar/parameters/... path or Models/... filename.
#   * Files whose name starts with "_" (like this one) are ignored by the app,
#     so this template never shows up as a selectable language.
#
# Tip: en.toml is the always-up-to-date reference. If a new app version adds
# keys that your file is missing, those strings just show in English until you
# add them; compare against en.toml to catch up.
# ============================================================================

[meta]
code = ""            # e.g. "de"  (short locale code; also used as the filename)
name = ""            # English name, e.g. "German"
native_name = ""     # shown in the dropdown, e.g. "Deutsch"
authors = [""]       # optional: your name/handle for credit


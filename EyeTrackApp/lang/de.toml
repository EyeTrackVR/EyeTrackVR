# EN: "Start tracking when SteamVR starts and stop when it exits."
start_stop_steamvr_tip = "Startet das Tracking, wenn SteamVR startet, und stoppt es, wenn es beendet wird."
# EN: "Use GPU Acceleration"
use_gpu = "GPU-Beschleunigung verwenden"
# EN: "Run the LEAP neural-network model on the GPU when available. Disable if you see crashes or driver issues."
use_gpu_tip = "Führt das neuronale LEAP-Modell auf der GPU aus, wenn verfügbar. Deaktivieren, wenn Abstürze oder Treiberprobleme auftreten."
# EN: "Check For Updates"
check_updates = "Nach Updates suchen"
# EN: "Check GitHub for a new ETVR release on startup."
check_updates_tip = "Prüft beim Start auf GitHub, ob eine neue ETVR-Version verfügbar ist."
# EN: "Eye Difference Threshold"
eye_diff_threshold = "Schwellenwert für Augenunterschied"
# EN: "How far apart the two eyes' positions must be (normalised, 0–1) before Outer Eye Falloff kicks in. Lower = falloff triggers sooner."
eye_diff_threshold_tip = "Wie weit die Positionen der beiden Augen auseinanderliegen müssen (normalisiert, 0–1), bevor der äußere Augen-Falloff einsetzt. Niedriger = Falloff wird früher ausgelöst."
# EN: "Use SteamVR Overlay for Calibration"
use_overlay_cal = "SteamVR-Overlay zur Kalibrierung verwenden"
# EN: "Calibrate inside the headset via the SteamVR overlay: Start Calibration runs the Smart Calib dot sequence for the NEXT tracker, or the dot spiral for other trackers. When off, the classic on-screen calibration is used instead."
use_overlay_cal_tip = "Kalibrierung im Headset über das SteamVR-Overlay: Kalibrierung starten führt beim NEXT-Tracker die Smart-Kalibrierungs-Punktsequenz aus, bei anderen Trackern die Punktspirale. Wenn deaktiviert, wird stattdessen die klassische Kalibrierung auf dem Bildschirm verwendet."
# EN: "Show ET Debug in Tracking"
show_et_debug = "ET-Debug im Tracking anzeigen"
# EN: "Show the algorithm debug image (processed eye + threshold) in the tracking view. Off by default. The gaze dot and blink bar are always visible regardless."
show_et_debug_tip = "Zeigt das Debug-Bild des Algorithmus (verarbeitetes Auge + Schwellenwert) in der Tracking-Ansicht. Standardmäßig aus. Der Blickpunkt und der Blinzelbalken sind unabhängig davon immer sichtbar."
# EN: "Language"
language = "Sprache"
# EN: "Choose the app's display language. Restart EyeTrackVR after changing."
language_tip = "Wähle die Anzeigesprache der App. Starte EyeTrackVR nach der Änderung neu."
# EN: "Language changed"
language_restart_title = "Sprache geändert"
# EN: "Restart EyeTrackVR to apply the new language."
language_restart_note = "Starte EyeTrackVR neu, um die neue Sprache anzuwenden."

[algo_tracking]
# EN: "NEXT (beta)"
next_beta = "NEXT (beta)"
# EN: "Max Tracking Speed (Hz)"
max_tracking_speed = "Max. Tracking-Geschwindigkeit (Hz)"
# EN: "Maximum frames per second the tracker will process. Lower = less CPU, but jerkier motion. 60 Hz is comfortable for most setups."
max_tracking_speed_tip = "Maximale Bilder pro Sekunde, die der Tracker verarbeitet. Niedriger = weniger CPU, aber ruckeligere Bewegung. 60 Hz ist für die meisten Setups angenehm."
# EN: "Model"
model = "Modell"
# EN: "Which model variant to load for both the NEXT tracker and the eyebrow model. ETVR is the default; BSB and Tobii load the matching NEXT_<variant>.onnx / Eyebrow_<variant>.onnx files. The Lite options (ETVR Lite / BSB Lite) load an fp16 build of the NEXT model (smaller and faster, at a small precision cost)."
model_tip = "Welche Modellvariante sowohl für den NEXT-Tracker als auch für das Augenbrauenmodell geladen wird. ETVR ist die Standardeinstellung; BSB und Tobii laden die passenden Dateien NEXT_<variant>.onnx / Eyebrow_<variant>.onnx. Die Lite-Optionen (ETVR Lite / BSB Lite) laden einen fp16-Build des NEXT-Modells (kleiner und schneller, mit geringem Präzisionsverlust)."
# EN: "Tracking Algorithm (advanced)"
advanced_heading = "Tracking-Algorithmus (erweitert)"
# EN: "LEAP: neural-network pupil tracker. Best general-purpose choice; handles low contrast and partial occlusion well."
leap_tip = "LEAP: neuronaler Pupillen-Tracker. Beste Allzweckwahl; kommt gut mit niedrigem Kontrast und teilweiser Verdeckung zurecht."
# EN: "AHRAC: adaptive HSF + RANSAC. Falls back to RANSAC when HSF can't lock on. Good middle ground."
ahrac_tip = "AHRAC: adaptives HSF + RANSAC. Greift auf RANSAC zurück, wenn HSF sich nicht einrasten kann. Guter Kompromiss."
# EN: "DADDY: older neural-network tracker. Heavier than LEAP; usually no reason to pick this unless LEAP misbehaves on your camera."
daddy_tip = "DADDY: älterer neuronaler Tracker. Schwerer als LEAP; normalerweise kein Grund, dies zu wählen, außer LEAP funktioniert mit deiner Kamera schlecht."
# EN: "RANSAC 3D: fits an ellipse to the pupil edge in 3D. Robust to lighting changes but slower than LEAP."
ransac3d_tip = "RANSAC 3D: passt eine Ellipse an den Pupillenrand in 3D an. Robust gegenüber Beleuchtungsänderungen, aber langsamer als LEAP."
# EN: "NEXT: end-to-end neural network tracker. Takes the raw camera frame and directly outputs gaze, eyebrow, eyelid, and squint."
next_tip = "NEXT: durchgängiger neuronaler Tracker. Nimmt das rohe Kamerabild und gibt direkt Blick, Augenbraue, Lid und Zusammenkneifen aus."
# EN: "AHSF: adaptive Haar surround feature. Fast classical tracker."
ahsf_tip = "AHSF: adaptives Haar-Surround-Feature. Schneller klassischer Tracker."
# EN: "HSRAC: Haar surround + RANSAC. Older HSF/RANSAC hybrid."
hsrac_tip = "HSRAC: Haar-Surround + RANSAC. Älterer HSF/RANSAC-Hybrid."
# EN: "HSF: Haar surround feature. Classical, very fast, less robust."
hsf_tip = "HSF: Haar-Surround-Feature. Klassisch, sehr schnell, weniger robust."

[algo_blink]
# EN: "raw: {value}"

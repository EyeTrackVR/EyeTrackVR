blink_point_tip = "Unterhalb dieses rohen Lid-Werts wird das Auge als vollständig geschlossen gemeldet (Ausgabe = 0). Erhöhe ihn, damit Blinzeln leichter auslöst; senke ihn, wenn die App geschlossen meldet, während dein Auge geöffnet ist."
# EN: "Wide-eye point"
wide_eye_point = "Weitaugenpunkt"
# EN: "Above this raw lid value the eye starts mapping into the wide-open range (output > 0.75). Lower it to make wide-eye/surprise easier to trigger."
wide_eye_point_tip = "Oberhalb dieses rohen Lid-Werts wird das Auge in den weit geöffneten Bereich abgebildet (Ausgabe > 0.75). Senke ihn, damit weit geöffnete Augen/Überraschung leichter auslösen."
# EN: "LEAP Lid Blink Algo"
leap_lid = "LEAP-Lid-Blinzel-Algorithmus"
# EN: "Use the LEAP neural-network model to detect eyelid openness. Recommended for most users. Disable only if LEAP misbehaves on your camera."
leap_lid_tip = "Verwendet das neuronale LEAP-Modell, um die Lidöffnung zu erkennen. Für die meisten Nutzer empfohlen. Nur deaktivieren, wenn LEAP mit deiner Kamera schlecht funktioniert."
# EN: "Intensity Based Openness"
intensity_based_openness = "Intensitätsbasierte Öffnung"
# EN: "Detect blinks by raw image intensity instead of LEAP. Fallback for cameras where LEAP under-performs (low light, occluded lashes)."
intensity_based_openness_tip = "Erkennt Blinzeln anhand der rohen Bildintensität statt über LEAP. Alternative für Kameras, bei denen LEAP schwach abschneidet (wenig Licht, verdeckte Wimpern)."
# EN: "EyeBrow"

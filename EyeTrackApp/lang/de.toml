# EN: "Flip Y Axis"
flip_y = "Y-Achse spiegeln"
# EN: "Mirror both eyes vertically. Use if your camera is rotated 180°."
flip_y_tip = "Spiegelt beide Augen vertikal. Verwende dies, wenn deine Kamera um 180° gedreht ist."
# EN: "Outer Eye Falloff"
outer_falloff = "Äußerer Augen-Falloff"
# EN: "When one eye drifts far from the other, mirror the cleaner eye's position. Hides tracking glitches on mismatched cameras. Recommended on."
outer_falloff_tip = "Wenn ein Auge weit vom anderen abweicht, wird die Position des saubereren Auges gespiegelt. Verbirgt Tracking-Störungen bei ungleichen Kameras. Aktiviert empfohlen."
# EN: "Force Left Eye Dominant"
force_left_dominant = "Linkes Auge dominant erzwingen"
# EN: "Force the left eye to drive output when the two eyes disagree. Useful if your right camera is significantly less reliable."
force_left_dominant_tip = "Erzwingt, dass das linke Auge die Ausgabe steuert, wenn die beiden Augen nicht übereinstimmen. Nützlich, wenn deine rechte Kamera deutlich weniger zuverlässig ist."
# EN: "Force Right Eye Dominant"
force_right_dominant = "Rechtes Auge dominant erzwingen"
# EN: "Force the right eye to drive output when the two eyes disagree. Useful if your left camera is significantly less reliable."
force_right_dominant_tip = "Erzwingt, dass das rechte Auge die Ausgabe steuert, wenn die beiden Augen nicht übereinstimmen. Nützlich, wenn deine linke Kamera deutlich weniger zuverlässig ist."

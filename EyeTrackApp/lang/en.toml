# ---------------------------------------------------------------------------
# Tracking algorithm module (Algo Settings tab)
# ---------------------------------------------------------------------------
[algo_tracking]
next_beta = "NEXT (beta)"
next_calib_lids_brows = "NEXT calib Lids and Brows"
next_calib_lids_brows_tip = "During NEXT Smart Calib, also calibrate eyelid and eyebrow. Your face stays neutral through the whole dot sequence, so those frames capture your resting readings: eyelids are anchored to 0.75 (normally open) and eyebrows to 0.5 (neutral), while fully closed and fully open/raised stay where they are. Turn off to send the model's raw eyelid and eyebrow output."
allow_calibration = "Allow Calibration"
allow_calibration_tip = "Pipe NEXT gaze output through the standard calibration filter (ellipse / robust) instead of Smart Calib, and apply the Blink Point / Wide-eye Point remap to the eyelid output. Start Calibration then runs the classic method."
max_tracking_speed = "Max Tracking Speed (Hz)"
max_tracking_speed_tip = "Maximum frames per second the tracker will process. Lower = less CPU, but jerkier motion. 60 Hz is comfortable for most setups."
model = "Model"
model_tip = "Which model variant to load for both the NEXT tracker and the eyebrow model. ETVR is the default; BSB and Tobii load the matching NEXT_<variant>.onnx / Eyebrow_<variant>.onnx files. With two eyes connected the matching stereo build (NEXT_<variant>_STEREO.onnx) is used automatically, if the variant ships one. The Lite options (ETVR Lite / BSB Lite) load an fp16 build of the NEXT model (smaller and faster, at a small precision cost)."
advanced_heading = "Tracking Algorithm (advanced)"
leap_tip = "LEAP: neural-network pupil tracker. Best general-purpose choice; handles low contrast and partial occlusion well."
ahrac_tip = "AHRAC: adaptive HSF + RANSAC. Falls back to RANSAC when HSF can't lock on. Good middle ground."
daddy_tip = "DADDY: older neural-network tracker. Heavier than LEAP; usually no reason to pick this unless LEAP misbehaves on your camera."
ransac3d_tip = "RANSAC 3D: fits an ellipse to the pupil edge in 3D. Robust to lighting changes but slower than LEAP."
next_tip = "NEXT: end-to-end neural network tracker. Takes the raw camera frame and directly outputs gaze, eyebrow, eyelid, and squint. With two eyes connected it automatically runs the stereo model (both eyes in one pass, shared gaze, per-eye eyebrow/eyelid/squint); with one eye it runs the mono model."
ahsf_tip = "AHSF: adaptive Haar surround feature. Fast classical tracker."
hsrac_tip = "HSRAC: Haar surround + RANSAC. Older HSF/RANSAC hybrid."
hsf_tip = "HSF: Haar surround feature. Classical, very fast, less robust."


readout_adj = "adj: {value}"
manual_tuning = "Manual Eyelid Tuning"
reset_defaults = "Reset to Default"
blink_point = "Blink point"
blink_point_tip = "Below this raw lid value the eye is reported as fully closed (output = 0). Raise it to make blinks trigger easier; lower it if the app reports closed when your eye is open."
wide_eye_point = "Wide-eye point"
wide_eye_point_tip = "Above this raw lid value the eye starts mapping into the wide-open range (output > 0.75). Lower it to make wide-eye/surprise easier to trigger."
leap_lid = "LEAP Lid Blink Algo"
leap_lid_tip = "Use the LEAP neural-network model to detect eyelid openness. Recommended for most users. Disable only if LEAP misbehaves on your camera."
intensity_based_openness = "Intensity Based Openness"
intensity_based_openness_tip = "Detect blinks by raw image intensity instead of LEAP. Fallback for cameras where LEAP under-performs (low light, occluded lashes)."
eyebrow = "EyeBrow"
eyebrow_tip = "Run the EyeBrow neural-network model on each raw camera frame (pre-crop, pre-rotation) and send the result as a float [0-1] over OSC. Dual-eye: /avatar/parameters/v2/BrowExpressionLeft and BrowExpressionRight. Single-eye: /avatar/parameters/v2/BrowExpression. Requires Models/Eyebrow_<variant>.onnx (variant chosen via the Model selector under Tracking Algorithm)."
hint = "↑ Blink point = blinks trigger easier · ↓ Wide-eye point = wide-eye triggers easier"
left_eye = "Left Eye"
right_eye = "Right Eye"
redo_eyelid_calib = "Redo Eyelid Calib"
redo_eyelid_calib_tip = "Clear the stored eyelid calibration for both eyes and restart the sampling window. Use after changing camera position, IR brightness, or if blink detection drifted."
restarting = "Restarting…"
advanced_heading = "Eyelid calibration (advanced)"
calibration_duration = "Calibration duration (seconds)"
calibration_duration_tip = "How many seconds to record your eyelid motion before locking in the open/closed bounds. Longer = more reliable but slower; blink several times during the window."
min_blink_size = "Min blink size during calibration"
min_blink_size_tip = "Calibration is rejected and restarted if your eye opened/closed by less than this amount during the sampling window. Catches the case where you forgot to blink."


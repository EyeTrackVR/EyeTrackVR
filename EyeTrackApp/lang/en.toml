left_source_tip = "Capture source for the left eye. Pick from the dropdown (populated by Scan) or type a value: UVC index (e.g. 0), COM/serial port (e.g. COM5, /dev/cu.usbserial-0001), or URL (e.g. http://etvr-left.local/)."
# Label for the right-eye capture source field (ETVR mode)
right_source = "Right (UVC / COM port / URL):"
right_source_tip = "Capture source for the right eye. See the Left field for accepted formats."
# Label for the single shared source field (Bigscreen mode)
source_uvc_index = "Source (UVC Index):"
# Label for the right field in Bigscreen mode (mirrors the left source)
right_same_source = "Right (same source):"
# Button: scan for connected cameras

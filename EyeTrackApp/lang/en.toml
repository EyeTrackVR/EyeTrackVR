# ============================================================================
# EyeTrackVR: English language file (canonical source of truth)
# ============================================================================
# This file defines every user-facing string in the app, grouped into sections.
# It is ALWAYS loaded as the fallback: if another language is missing a key, the
# English text here is shown instead. To add a new language, copy _TEMPLATE.toml
# (do NOT copy this file), fill in the [meta] block and translate the values.
#
# Rules for translators (see _TEMPLATE.toml for the full guide):
#   * Translate the VALUE on the right of each `=`. Never change the key names.
#   * Keep {placeholders} exactly as written; they are filled in at runtime.
#   * Do NOT translate product/proper names: EyeTrackVR, NEXT, LEAP, HSF, HSRAC,
#     RANSAC, DADDY, AHSF, BSB, TOBII, ETVR, SteamVR, VRChat, VRCFT, OpenVR, UVC,
#     COM, OSC, GPU, Discord, URL, IP, mDNS, or any /avatar/parameters/... path.
# ============================================================================

[meta]
code = "en"
name = "English"
native_name = "English"
authors = ["EyeTrackVR"]

# ---------------------------------------------------------------------------
# Navigation tabs (top of the main window)
# ---------------------------------------------------------------------------
[nav]
tracking = "Tracking"
settings = "Settings"
algo = "Algo Settings"
vrcft = "VRCFT Module Settings"


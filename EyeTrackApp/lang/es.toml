flip_y_tip = "Refleja ambos ojos verticalmente. Úsalo si tu cámara está rotada 180°."
# EN: "Outer Eye Falloff"
outer_falloff = "Caída del ojo exterior"
# EN: "When one eye drifts far from the other, mirror the cleaner eye's position. Hides tracking glitches on mismatched cameras. Recommended on."
outer_falloff_tip = "Cuando un ojo se desvía mucho del otro, refleja la posición del ojo más limpio. Oculta fallos de seguimiento en cámaras dispares. Recomendado activado."
# EN: "Force Left Eye Dominant"
force_left_dominant = "Forzar ojo izquierdo dominante"
# EN: "Force the left eye to drive output when the two eyes disagree. Useful if your right camera is significantly less reliable."
force_left_dominant_tip = "Fuerza que el ojo izquierdo controle la salida cuando los dos ojos no coinciden. Útil si tu cámara derecha es notablemente menos fiable."
# EN: "Force Right Eye Dominant"
force_right_dominant = "Forzar ojo derecho dominante"
# EN: "Force the right eye to drive output when the two eyes disagree. Useful if your left camera is significantly less reliable."

eye_diff_threshold_tip = "Qué tan separadas deben estar las posiciones de los dos ojos (normalizado, 0–1) antes de que se active la Caída del ojo exterior. Menor = la caída se activa antes."
# EN: "Use SteamVR Overlay for Calibration"
use_overlay_cal = "Usar superposición de SteamVR para calibrar"
# EN: "Calibrate inside the headset via the SteamVR overlay: Start Calibration runs the Smart Calib dot sequence for the NEXT tracker, or the dot spiral for other trackers. When off, the classic on-screen calibration is used instead."
use_overlay_cal_tip = "Calibra dentro del visor mediante la superposición de SteamVR: Iniciar calibración ejecuta la secuencia de puntos de la calibración inteligente con el rastreador NEXT, o la espiral de puntos con los demás rastreadores. Cuando está desactivado, se usa la calibración clásica en pantalla."
# EN: "Show ET Debug in Tracking"
show_et_debug = "Mostrar depuración ET en el seguimiento"

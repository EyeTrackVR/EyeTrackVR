[algo_tracking]
# EN: "NEXT (alpha)"
next_beta = "NEXT (beta)"
# EN: "Allow Calibration"
allow_calibration = "Permitir calibración"
# EN: "Pipe NEXT gaze output through the standard calibration filter (ellipse / robust) instead of Smart Calib, and apply the Blink Point / Wide-eye Point remap to the eyelid output. Start Calibration then runs the classic method."
allow_calibration_tip = "Pasa la salida de mirada de NEXT por el filtro de calibración estándar (elipse / robusto) en lugar de la calibración inteligente, y aplica el remapeo de Punto de parpadeo / Punto de ojo abierto a la salida del párpado. Iniciar calibración ejecuta entonces el método clásico."
# EN: "Max Tracking Speed (Hz)"
max_tracking_speed = "Velocidad máx. de seguimiento (Hz)"
# EN: "Maximum frames per second the tracker will process. Lower = less CPU, but jerkier motion. 60 Hz is comfortable for most setups."
max_tracking_speed_tip = "Máximo de fotogramas por segundo que procesará el seguimiento. Menor = menos CPU, pero movimiento más brusco. 60 Hz es cómodo para la mayoría de configuraciones."
# EN: "Model"
model = "Modelo"
# EN: "Which model variant to load for both the NEXT tracker and the eyebrow model. ETVR is the default; BSB and Tobii load the matching NEXT_<variant>.onnx / Eyebrow_<variant>.onnx files. The Lite options (ETVR Lite / BSB Lite) load an fp16 build of the NEXT model (smaller and faster, at a small precision cost)."
model_tip = "Qué variante de modelo cargar tanto para el seguimiento NEXT como para el modelo de ceja. ETVR es la predeterminada; BSB y Tobii cargan los archivos NEXT_<variant>.onnx / Eyebrow_<variant>.onnx correspondientes. Las opciones Lite (ETVR Lite / BSB Lite) cargan una compilación fp16 del modelo NEXT: más pequeña y rápida, con un pequeño coste de precisión."
# EN: "Tracking Algorithm (advanced)"
advanced_heading = "Algoritmo de seguimiento (avanzado)"
# EN: "LEAP: neural-network pupil tracker. Best general-purpose choice; handles low contrast and partial occlusion well."
leap_tip = "LEAP: seguimiento de pupila por red neuronal. La mejor opción de uso general; maneja bien el bajo contraste y la oclusión parcial."
# EN: "AHRAC: adaptive HSF + RANSAC. Falls back to RANSAC when HSF can't lock on. Good middle ground."
ahrac_tip = "AHRAC: HSF adaptativo + RANSAC. Recurre a RANSAC cuando HSF no logra fijarse. Buen término medio."
# EN: "DADDY: older neural-network tracker. Heavier than LEAP; usually no reason to pick this unless LEAP misbehaves on your camera."
daddy_tip = "DADDY: seguimiento por red neuronal más antiguo. Más pesado que LEAP; normalmente no hay razón para elegirlo salvo que LEAP funcione mal con tu cámara."
# EN: "RANSAC 3D: fits an ellipse to the pupil edge in 3D. Robust to lighting changes but slower than LEAP."
ransac3d_tip = "RANSAC 3D: ajusta una elipse al borde de la pupila en 3D. Robusto ante cambios de iluminación pero más lento que LEAP."
# EN: "NEXT: end-to-end neural network tracker. Takes the raw camera frame and directly outputs gaze, eyebrow, eyelid, and squint."
next_tip = "NEXT: seguimiento por red neuronal de extremo a extremo. Toma el fotograma sin procesar de la cámara y produce directamente mirada, ceja, párpado y entrecerrado."
# EN: "AHSF: adaptive Haar surround feature. Fast classical tracker."
ahsf_tip = "AHSF: característica Haar de entorno adaptativa. Seguimiento clásico rápido."
# EN: "HSRAC: Haar surround + RANSAC. Older HSF/RANSAC hybrid."
hsrac_tip = "HSRAC: Haar de entorno + RANSAC. Híbrido HSF/RANSAC más antiguo."
# EN: "HSF: Haar surround feature. Classical, very fast, less robust."
hsf_tip = "HSF: característica Haar de entorno. Clásico, muy rápido, menos robusto."


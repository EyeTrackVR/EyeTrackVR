blink_point_tip = "Por debajo de este valor bruto de párpado el ojo se reporta como completamente cerrado (salida = 0). Súbelo para que los parpadeos se activen más fácilmente; bájalo si la app reporta cerrado cuando tu ojo está abierto."
# EN: "Wide-eye point"
wide_eye_point = "Punto de ojo abierto"
# EN: "Above this raw lid value the eye starts mapping into the wide-open range (output > 0.75). Lower it to make wide-eye/surprise easier to trigger."
wide_eye_point_tip = "Por encima de este valor bruto de párpado el ojo empieza a mapearse al rango de ojo muy abierto (salida > 0.75). Bájalo para que el ojo muy abierto/sorpresa se active más fácilmente."
# EN: "LEAP Lid Blink Algo"
leap_lid = "Algoritmo de parpadeo por párpado LEAP"
# EN: "Use the LEAP neural-network model to detect eyelid openness. Recommended for most users. Disable only if LEAP misbehaves on your camera."
leap_lid_tip = "Usa el modelo de red neuronal LEAP para detectar la apertura del párpado. Recomendado para la mayoría de usuarios. Desactívalo solo si LEAP funciona mal con tu cámara."
# EN: "Intensity Based Openness"
intensity_based_openness = "Apertura basada en intensidad"
# EN: "Detect blinks by raw image intensity instead of LEAP. Fallback for cameras where LEAP under-performs (low light, occluded lashes)."
intensity_based_openness_tip = "Detecta parpadeos por la intensidad bruta de la imagen en lugar de LEAP. Alternativa para cámaras donde LEAP rinde poco (poca luz, pestañas que tapan)."
# EN: "EyeBrow"

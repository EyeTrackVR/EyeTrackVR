daddy_tip = "DADDY: 古いニューラルネットワークトラッカー。LEAP より重く、通常はカメラで LEAP が誤動作しない限り選ぶ理由はありません。"
# EN: "RANSAC 3D: fits an ellipse to the pupil edge in 3D. Robust to lighting changes but slower than LEAP."
ransac3d_tip = "RANSAC 3D: 瞳孔の縁に 3D で楕円をフィットさせます。照明の変化に強いですが LEAP より低速です。"
# EN: "NEXT: end-to-end neural network tracker. Takes the raw camera frame and directly outputs gaze, eyebrow, eyelid, and squint."
next_tip = "NEXT: エンドツーエンドのニューラルネットワークトラッカー。カメラの生フレームを入力とし、視線・眉・まぶた・細めを直接出力します。"
# EN: "AHSF: adaptive Haar surround feature. Fast classical tracker."
ahsf_tip = "AHSF: 適応型 Haar サラウンド特徴。高速な古典的トラッカーです。"
# EN: "HSRAC: Haar surround + RANSAC. Older HSF/RANSAC hybrid."
hsrac_tip = "HSRAC: Haar サラウンド + RANSAC。古い HSF/RANSAC のハイブリッドです。"
# EN: "HSF: Haar surround feature. Classical, very fast, less robust."
hsf_tip = "HSF: Haar サラウンド特徴。古典的で非常に高速ですが、頑健性は低めです。"

[algo_blink]
# EN: "raw: {value}"
readout_raw = "生値: {value}"
# EN: "adj: {value}"
readout_adj = "調整値: {value}"
# EN: "Blink point"
blink_point = "まばたきポイント"
# EN: "Below this raw lid value the eye is reported as fully closed (output = 0). Raise it to make blinks trigger easier; lower it if the app reports closed when your eye is open."
blink_point_tip = "この生のまぶた値を下回ると、目は完全に閉じたと報告されます (出力 = 0)。上げるとまばたきが作動しやすくなり、目を開けているのに閉じたと報告される場合は下げてください。"
# EN: "Wide-eye point"
wide_eye_point = "見開きポイント"
# EN: "Above this raw lid value the eye starts mapping into the wide-open range (output > 0.75). Lower it to make wide-eye/surprise easier to trigger."
wide_eye_point_tip = "この生のまぶた値を上回ると、目は見開き範囲へのマッピングを開始します (出力 > 0.75)。下げると見開き/驚きが作動しやすくなります。"
# EN: "LEAP Lid Blink Algo"
leap_lid = "LEAP まぶたまばたきアルゴリズム"
# EN: "Use the LEAP neural-network model to detect eyelid openness. Recommended for most users. Disable only if LEAP misbehaves on your camera."
leap_lid_tip = "LEAP ニューラルネットワークモデルを使ってまぶたの開き具合を検出します。ほとんどのユーザーに推奨します。カメラで LEAP が誤動作する場合のみ無効化してください。"
# EN: "Intensity Based Openness"
intensity_based_openness = "輝度ベースの開き具合"
# EN: "Detect blinks by raw image intensity instead of LEAP. Fallback for cameras where LEAP under-performs (low light, occluded lashes)."
intensity_based_openness_tip = "LEAP の代わりに画像の生の輝度でまばたきを検出します。LEAP の性能が不十分なカメラ (暗い、まつげで遮られる) 向けの代替手段です。"
# EN: "EyeBrow"
eyebrow = "眉"
# EN: "Run the EyeBrow neural-network model on each raw camera frame (pre-crop, pre-rotation) and send the result as a float [0-1] over OSC. Dual-eye: /avatar/parameters/v2/BrowExpressionLeft and BrowExpressionRight. Single-eye: /avatar/parameters/v2/BrowExpression. Requires Models/Eyebrow_<variant>.onnx (variant chosen via the Model selector under Tracking Algorithm)."
eyebrow_tip = "各カメラの生フレーム (クロップ前・回転前) に対して眉のニューラルネットワークモデルを実行し、結果を浮動小数点 [0-1] として OSC で送信します。両目: /avatar/parameters/v2/BrowExpressionLeft と BrowExpressionRight。片目: /avatar/parameters/v2/BrowExpression。Models/Eyebrow_<variant>.onnx が必要です (バリアントはトラッキングアルゴリズムのモデルセレクターで選択)。"
# EN: "↑ Blink point = blinks trigger easier · ↓ Wide-eye point = wide-eye triggers easier"
hint = "↑ まばたきポイント = まばたきが作動しやすい · ↓ 見開きポイント = 見開きが作動しやすい"
# EN: "Left Eye"
left_eye = "左目"
# EN: "Right Eye"
right_eye = "右目"
# EN: "Redo Eyelid Calib"
redo_eyelid_calib = "まぶたキャリブレーションをやり直す"
# EN: "Clear the stored eyelid calibration for both eyes and restart the sampling window. Use after changing camera position, IR brightness, or if blink detection drifted."
redo_eyelid_calib_tip = "両目の保存済みまぶたキャリブレーションを消去し、サンプリングウィンドウを再開します。カメラ位置や IR の明るさを変更した後、またはまばたき検出がずれた場合に使用します。"
# EN: "Restarting…"
restarting = "再起動中…"
# EN: "Eyelid calibration (advanced)"
advanced_heading = "まぶたキャリブレーション (詳細設定)"
# EN: "Calibration duration (seconds)"
calibration_duration = "キャリブレーション時間 (秒)"
# EN: "How many seconds to record your eyelid motion before locking in the open/closed bounds. Longer = more reliable but slower; blink several times during the window."
calibration_duration_tip = "開/閉の範囲を確定する前にまぶたの動きを記録する秒数。長いほど信頼性は上がりますが時間がかかります。ウィンドウの間に何度かまばたきしてください。"
# EN: "Min blink size during calibration"
min_blink_size = "キャリブレーション中の最小まばたき量"
# EN: "Calibration is rejected and restarted if your eye opened/closed by less than this amount during the sampling window. Catches the case where you forgot to blink."
min_blink_size_tip = "サンプリングウィンドウ中に目の開閉がこの量未満だった場合、キャリブレーションは却下され再開されます。まばたきを忘れた場合を検出します。"


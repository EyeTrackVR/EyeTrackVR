# ============================================================================
# EyeTrackVR: Japanese (日本語) language file
# ============================================================================
# Each key mirrors en.toml. The `# EN: "..."` comment above every entry shows
# the original English source so you can see what is being translated. Keep the
# key names and any {placeholders} unchanged; translate only the quoted value.
# Product/proper names (EyeTrackVR, NEXT, LEAP, SteamVR, VRChat, VRCFT, UVC, OSC,
# GPU, mDNS, /avatar/parameters/... paths, etc.) are left verbatim on purpose.
# ============================================================================


[algo_tracking]
# EN: "Max Tracking Speed (Hz)"
max_tracking_speed = "Max. Tracking-Geschwindigkeit (Hz)"
# EN: "Maximum frames per second the tracker will process. Lower = less CPU, but jerkier motion. 60 Hz is comfortable for most setups."
max_tracking_speed_tip = "Maximale Bilder pro Sekunde, die der Tracker verarbeitet. Niedriger = weniger CPU, aber ruckeligere Bewegung. 60 Hz ist für die meisten Setups angenehm."
# EN: "Headset"
headset = "Headset"
# EN: "Which headset the NEXT models were trained for: ETVR, BSB, or PSVR/Tobii (one shared model). Each supports one or two eyes, and the eyebrow model follows this choice too. BSB follows Bigscreen setup mode automatically; PSVR/Tobii is a manual choice that stays selected when setup mode changes."
headset_tip = "Für welches Headset die NEXT-Modelle trainiert wurden: ETVR, BSB oder PSVR/Tobii (ein gemeinsames Modell). Jedes unterstützt ein oder zwei Augen, und das Augenbrauenmodell folgt dieser Auswahl ebenfalls. BSB folgt automatisch dem Bigscreen-Setup-Modus; PSVR/Tobii ist eine manuelle Auswahl, die beim Wechsel des Setup-Modus erhalten bleibt."
# EN: "Model Size"
model_size = "Modellgröße"
# EN: "Trade tracking quality for speed. Normal is the default and fits most PCs. Moving right picks a larger model that tracks a bit better and uses more compute: Large, then XL (XL is ETVR and BSB only; PSVR uses Large). Lite, at the far left, is Normal at half precision."
model_size_tip = "Tracking-Qualität gegen Geschwindigkeit abwägen. Normal ist der Standard und passt für die meisten PCs. Weiter rechts wird ein größeres Modell gewählt, das etwas besser trackt und mehr Rechenleistung braucht: Groß, dann XL (XL nur für ETVR und BSB; PSVR nutzt Groß). Lite ganz links ist Normal mit halber Genauigkeit."
# EN: "Lightest"
model_size_lightest = "Am leichtesten"
# EN: "Best"
model_size_best = "Am besten"
# EN: "Normal"
model_size_normal = "Normal"
# EN: "Lite"
model_size_lite = "Lite"
# EN: "Large"
model_size_large = "Groß"
# EN: "XL"
model_size_xl = "XL"
# EN: "Tracking Algorithm (advanced)"
advanced_heading = "Tracking-Algorithmus (erweitert)"
# EN: "LEAP: neural-network pupil tracker. Best general-purpose choice; handles low contrast and partial occlusion well."
leap_tip = "LEAP: neuronaler Pupillen-Tracker. Beste Allzweckwahl; kommt gut mit niedrigem Kontrast und teilweiser Verdeckung zurecht."
# EN: "AHRAC: adaptive HSF + RANSAC. Falls back to RANSAC when HSF can't lock on. Good middle ground."
ahrac_tip = "AHRAC: adaptives HSF + RANSAC. Greift auf RANSAC zurück, wenn HSF sich nicht einrasten kann. Guter Kompromiss."
# EN: "DADDY: older neural-network tracker. Heavier than LEAP; usually no reason to pick this unless LEAP misbehaves on your camera."
daddy_tip = "DADDY: älterer neuronaler Tracker. Schwerer als LEAP; normalerweise kein Grund, dies zu wählen, außer LEAP funktioniert mit deiner Kamera schlecht."
# EN: "RANSAC 3D: fits an ellipse to the pupil edge in 3D. Robust to lighting changes but slower than LEAP."
ransac3d_tip = "RANSAC 3D: passt eine Ellipse an den Pupillenrand in 3D an. Robust gegenüber Beleuchtungsänderungen, aber langsamer als LEAP."
# EN: "NEXT: end-to-end neural network tracker. Takes the raw camera frame and directly outputs gaze, eyebrow, eyelid, and squint."
next_tip = "NEXT: durchgängiger neuronaler Tracker. Nimmt das rohe Kamerabild und gibt direkt Blick, Augenbraue, Lid und Zusammenkneifen aus."
# EN: "AHSF: adaptive Haar surround feature. Fast classical tracker."
ahsf_tip = "AHSF: adaptives Haar-Surround-Feature. Schneller klassischer Tracker."
# EN: "HSRAC: Haar surround + RANSAC. Older HSF/RANSAC hybrid."
hsrac_tip = "HSRAC: Haar-Surround + RANSAC. Älterer HSF/RANSAC-Hybrid."
# EN: "HSF: Haar surround feature. Classical, very fast, less robust."
hsf_tip = "HSF: Haar-Surround-Feature. Klassisch, sehr schnell, weniger robust."
# EN: "Eyebrow L/R Sync"
next_brow_sync = "Augenbrauen-L/R-Sync"
# EN: "Keeps your two eyebrows reading the same while your face is neutral. Small left/right differences are averaged; raising one brow clearly more than the other still comes through. Higher = held together over larger differences, lower keeps smaller one-sided raises. 0 = off. Needs both eyes on the shared NEXT model."
next_brow_sync_tip = "Hält beide Augenbrauen bei neutralem Gesicht gleich. Kleine Unterschiede zwischen links und rechts werden gemittelt; eine Braue deutlich stärker zu heben kommt weiterhin durch. Höher = hält auch bei größeren Unterschieden zusammen, niedriger = lässt kleinere einseitige Bewegungen durch. 0 = aus. Benötigt beide Augen auf dem gemeinsamen NEXT-Modell."
# EN: "NEXT calib Lids and Brows"
next_calib_lids_brows = "NEXT-Kalibrierung für Lider und Brauen"
# EN: "During NEXT Smart Calib, also calibrate eyelid and eyebrow. Your face stays neutral through the whole dot sequence, so those frames capture your resting readings: eyelids are anchored to 0.75 (normally open) and eyebrows to 0.5 (neutral), while fully closed and fully open/raised stay where they are. Turn off to send the model's raw eyelid and eyebrow output."
next_calib_lids_brows_tip = "Kalibriert bei der NEXT-Smart-Kalibrierung auch Augenlider und Augenbrauen. Dein Gesicht bleibt während der gesamten Punktsequenz neutral, daher erfassen diese Bilder deine Ruhewerte: Lider werden auf 0,75 (normal geöffnet) und Brauen auf 0,5 (neutral) verankert, während vollständig geschlossen und vollständig geöffnet/angehoben unverändert bleiben. Ausschalten, um die rohe Lid- und Brauenausgabe des Modells zu senden."
# EN: "Record Smart Calib runs"
next_smartcal_recording = "Smart-Calib-Durchläufe aufzeichnen"
# EN: "Save each NEXT Smart Calib run to the smartcal folder inside the logs folder, so a calibration that failed or came out inaccurate can be looked into. Only numbers are saved: time, raw gaze, eyelid and eyebrow readings and the result. No camera images. The newest 20 runs are kept. They are part of the logs folder, so they go along when you attach it to a bug report. Turn off to stop saving them; runs already saved stay until you delete them."
next_smartcal_recording_tip = "Speichert jeden NEXT-Smart-Calib-Durchlauf im Ordner smartcal innerhalb des Log-Ordners, damit sich eine fehlgeschlagene oder ungenaue Kalibrierung untersuchen lässt. Gespeichert werden nur Zahlen: Zeit, rohe Blickwerte, Lid- und Brauenwerte und das Ergebnis. Keine Kamerabilder. Die neuesten 20 Durchläufe bleiben erhalten. Sie gehören zum Log-Ordner und sind daher dabei, wenn du ihn an einen Fehlerbericht anhängst. Ausschalten, um nichts mehr zu speichern; bereits gespeicherte Durchläufe bleiben, bis du sie löschst."
# EN: "Dominant"
next_dominant_eye = "Dominant"
# EN: "Left"
next_dominant_eye_left = "Links"
# EN: "Right"
next_dominant_eye_right = "Rechts"
# EN: "Your dominant (fixating) eye, the one that looks straight at what you focus on. Dominant eye mode follows it, and in both per-eye modes Smart Calib and recenter are taken from it and applied to both eyes."
next_dominant_eye_tip = "Dein dominantes (fixierendes) Auge, das direkt auf das schaut, was du fokussierst. Der Modus „Dominantes Auge“ folgt ihm, und in beiden Pro-Auge-Modi werden Smart-Kalibrierung und Zentrierung von ihm übernommen und auf beide Augen angewendet."
# EN: "NEXT gaze"
next_gaze_mode = "NEXT-Blick"
# EN: "Dominant eye"
next_gaze_mode_dominant = "Dominantes Auge"
# EN: "Fused"
next_gaze_mode_fused = "Fusioniert"
# EN: "Independent"
next_gaze_mode_independent = "Unabhängig"
# EN: "What your avatar's eyes follow. Fused (default): one shared gaze read from both cameras, the steadiest choice when your eyes point together. Independent: each avatar eye follows its own eye, so a crossed or lazy eye shows as it really is. Dominant eye: both avatar eyes follow the eye picked next to this, for accurate gaze without showing the deviation. The per-eye modes need the shared NEXT model; in them Smart Calib and recenter use the dominant eye only, so they keep your real deviation. Re-run NEXT Smart Calib after changing this."
next_gaze_mode_tip = "Was die Augen deines Avatars verfolgen. Fusioniert (Standard): ein gemeinsamer Blick aus beiden Kameras, am stabilsten, wenn deine Augen in dieselbe Richtung zeigen. Unabhängig: jedes Avatarauge folgt seinem eigenen Auge, sodass Schielen oder ein träges Auge wie in Wirklichkeit sichtbar wird. Dominantes Auge: beide Avataraugen folgen dem daneben gewählten Auge, für genauen Blick ohne sichtbare Abweichung. Die Pro-Auge-Modi benötigen das gemeinsame NEXT-Modell; in ihnen nutzen Smart-Kalibrierung und Zentrierung nur das dominante Auge und behalten so deine echte Abweichung bei. Führe nach einer Änderung die NEXT-Smart-Kalibrierung erneut aus."
# EN: "Eyelid L/R Sync"
next_lid_sync = "Augenlid-L/R-Sync"
# EN: "Keeps your two eyelids reading the same while your face is neutral, so one eyelid does not wander on its own while you look around. Small left/right differences are averaged; clear ones like a wink or a one-sided squint come through as tracked. Higher = held together over larger differences. 0 = off. Needs both eyes on the shared NEXT model."
next_lid_sync_tip = "Hält beide Augenlider bei neutralem Gesicht gleich, damit ein Lid beim Umherschauen nicht von allein wandert. Kleine Unterschiede zwischen links und rechts werden gemittelt; deutliche wie Zwinkern oder einseitiges Zusammenkneifen kommen wie erfasst durch. Höher = hält auch bei größeren Unterschieden zusammen. 0 = aus. Benötigt beide Augen auf dem gemeinsamen NEXT-Modell."
# EN: "Hold vertical gaze when squinting"
next_squint_y_hold = "Vertikalen Blick beim Zusammenkneifen halten"
# EN: "Turn this on if your eyes move up or down on their own when you squint. As your eyes close, vertical gaze fades to its last steady position instead of following your eyelid. A long squint still follows slowly. Horizontal gaze isn't affected. Off by default."
next_squint_y_hold_tip = "Einschalten, wenn sich deine Augen beim Zusammenkneifen von selbst nach oben oder unten bewegen. Wenn sich deine Augen schließen, geht der vertikale Blick zu seiner letzten stabilen Position über, statt deinem Augenlid zu folgen. Längeres Zusammenkneifen folgt weiterhin langsam. Der horizontale Blick bleibt unverändert. Standardmäßig aus."
# EN: "Off"
next_sync_off = "Aus"


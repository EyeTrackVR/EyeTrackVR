# ---------------------------------------------------------------------------
# Tracking algorithm module (Algo Settings tab)
# ---------------------------------------------------------------------------
[algo_tracking]
next_calib_lids_brows = "NEXT calib Lids and Brows"
next_calib_lids_brows_tip = "During NEXT Smart Calib, also calibrate eyelid and eyebrow. Your face stays neutral through the whole dot sequence, so those frames capture your resting readings: eyelids are anchored to 0.75 (normally open) and eyebrows to 0.5 (neutral), while fully closed and fully open/raised stay where they are. Turn off to send the model's raw eyelid and eyebrow output."
next_lid_sync = "Eyelid L/R Sync"
next_lid_sync_tip = "Keeps your two eyelids reading the same while your face is neutral, so one eyelid does not wander on its own while you look around. Small left/right differences are averaged; clear ones like a wink or a one-sided squint come through as tracked. Higher = held together over larger differences. 0 = off. Needs both eyes on the shared NEXT model."
next_brow_sync = "Eyebrow L/R Sync"
next_brow_sync_tip = "Keeps your two eyebrows reading the same while your face is neutral. Small left/right differences are averaged; raising one brow clearly more than the other still comes through. Higher = held together over larger differences, lower keeps smaller one-sided raises. 0 = off. Needs both eyes on the shared NEXT model."
next_sync_off = "Off"
next_gaze_mode = "NEXT gaze"
next_gaze_mode_tip = "What your avatar's eyes follow. Fused (default): one shared gaze read from both cameras, the steadiest choice when your eyes point together. Independent: each avatar eye follows its own eye, so a crossed or lazy eye shows as it really is. Dominant eye: both avatar eyes follow the eye picked next to this, for accurate gaze without showing the deviation. The per-eye modes need the shared NEXT model; in them Smart Calib and recenter use the dominant eye only, so they keep your real deviation. Re-run NEXT Smart Calib after changing this."
next_gaze_mode_fused = "Fused"
next_gaze_mode_independent = "Independent"
next_gaze_mode_dominant = "Dominant eye"
next_squint_y_hold = "Hold vertical gaze when squinting"
next_squint_y_hold_tip = "Turn this on if your eyes move up or down on their own when you squint. As your eyes close, vertical gaze fades to its last steady position instead of following your eyelid. A long squint still follows slowly. Horizontal gaze isn't affected. Off by default."
next_dominant_eye = "Dominant"
next_dominant_eye_tip = "Your dominant (fixating) eye, the one that looks straight at what you focus on. Dominant eye mode follows it, and in both per-eye modes Smart Calib and recenter are taken from it and applied to both eyes."
next_dominant_eye_left = "Left"
next_dominant_eye_right = "Right"
max_tracking_speed = "Max Tracking Speed (Hz)"
max_tracking_speed_tip = "Maximum frames per second the tracker will process. Lower = less CPU, but jerkier motion. 60 Hz is comfortable for most setups."
headset = "Headset"
headset_tip = "Which headset the NEXT models were trained for: ETVR, BSB, or PSVR/Tobii (one shared model). Each supports one or two eyes, and the eyebrow model follows this choice too. BSB follows Bigscreen setup mode automatically; PSVR/Tobii is a manual choice that stays selected when setup mode changes."
model_size = "Model Size"
model_size_tip = "Trade tracking quality for speed. Far right (Normal) tracks best and uses the most compute. Moving left picks a lighter, faster model: Lite (Normal at half precision), then Small, Mini, Micro and Nano. Only go smaller if Normal is too heavy for your PC or device."
model_size_lightest = "Lightest"
model_size_best = "Best"
model_size_wip = "These smaller models are a work in progress and may not perform well."
model_size_normal = "Normal"
model_size_lite = "Lite"
model_size_small = "Small"
model_size_mini = "Mini"
model_size_micro = "Micro"
model_size_nano = "Nano"
advanced_heading = "Tracking Algorithm (advanced)"
leap_tip = "LEAP: neural-network pupil tracker. Best general-purpose choice; handles low contrast and partial occlusion well."
ahrac_tip = "AHRAC: adaptive HSF + RANSAC. Falls back to RANSAC when HSF can't lock on. Good middle ground."
daddy_tip = "DADDY: older neural-network tracker. Heavier than LEAP; usually no reason to pick this unless LEAP misbehaves on your camera."
ransac3d_tip = "RANSAC 3D: fits an ellipse to the pupil edge in 3D. Robust to lighting changes but slower than LEAP."
next_tip = "NEXT: end-to-end neural network tracker. Takes the raw camera frame and directly outputs gaze, eyebrow, eyelid, and squint. ETVR, BSB, and PSVR each use a trained Hybrid model for single-eye or dual-eye tracking, with shared gaze and per-eye expressions. An unavailable or stale eye is handled automatically."
ahsf_tip = "AHSF: adaptive Haar surround feature. Fast classical tracker."
hsrac_tip = "HSRAC: Haar surround + RANSAC. Older HSF/RANSAC hybrid."
hsf_tip = "HSF: Haar surround feature. Classical, very fast, less robust."


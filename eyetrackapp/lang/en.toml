# OSC output settings (Settings tab)
# ---------------------------------------------------------------------------
[osc]
mode_native = "VRC Native"
mode_native_tip = "Send eye data over VRChat's built-in OSC parameters. Use for avatars wired to the native eye-look params (no extra mod required)."
mode_vrcft_v2 = "VRCFT (v2)"
mode_vrcft_v2_tip = "Send via VRCFaceTracking v2 params (current). Required for VRCFT-based avatars and facial-tracking add-ons."
mode_pyvrcft = "pyVRCFT (beta)"
mode_pyvrcft_tip = "Beta: send Unified Expressions straight to VRChat using the built-in PY-VRCFT port — no VRCFaceTracking app or module needed. Auto-detects the avatar (OSCQuery/mDNS) and its declared FT params. Replaces VRCFT; don't run both. Uses the OSC send/receive ports below."
receive = "Receive"
receive_tip = "Listen for incoming OSC messages from VRChat (e.g. calibration toggles from in-game)."
oscquery = "Auto port (OSCQuery)"
oscquery_tip = "Let VRChat find the receiver automatically (OSCQuery) instead of using the fixed Receiver Port, so it can run alongside VRCFaceTracking and other OSC apps. Same PC as VRChat only; falls back to the Receiver Port if it can't start."
foveation_gaze = "Foveated rendering gaze"

next_squint_y_hold = "Mantener la mirada vertical al entrecerrar"
# EN: "Turn this on if your eyes move up or down on their own when you squint. As your eyes close, vertical gaze fades to its last steady position instead of following your eyelid. A long squint still follows slowly. Horizontal gaze isn't affected. Off by default."
next_squint_y_hold_tip = "Actívalo si tus ojos se mueven solos hacia arriba o abajo al entrecerrarlos. Al cerrarse los ojos, la mirada vertical pasa a su última posición estable en lugar de seguir el párpado. Si los mantienes entrecerrados, sigue el movimiento lentamente. La mirada horizontal no se ve afectada. Desactivado de forma predeterminada."
# EN: "Off"
next_sync_off = "Desactivado"


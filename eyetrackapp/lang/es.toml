# EN: "Eyebrow L/R Sync"
next_brow_sync = "Sinc. I/D de cejas"
# EN: "Keeps your two eyebrows reading the same while your face is neutral. Small left/right differences are averaged; raising one brow clearly more than the other still comes through. Higher = held together over larger differences, lower keeps smaller one-sided raises. 0 = off. Needs both eyes on the shared NEXT model."
next_brow_sync_tip = "Mantiene ambas cejas iguales mientras tu cara está neutra. Las pequeñas diferencias entre izquierda y derecha se promedian; levantar claramente una ceja más que la otra se sigue detectando. Más alto = se mantienen juntas con diferencias mayores, más bajo = conserva movimientos de un solo lado más pequeños. 0 = desactivado. Requiere ambos ojos en el modelo NEXT compartido."
# EN: "NEXT calib Lids and Brows"
next_calib_lids_brows = "Calib. NEXT de párpados y cejas"
# EN: "During NEXT Smart Calib, also calibrate eyelid and eyebrow. Your face stays neutral through the whole dot sequence, so those frames capture your resting readings: eyelids are anchored to 0.75 (normally open) and eyebrows to 0.5 (neutral), while fully closed and fully open/raised stay where they are. Turn off to send the model's raw eyelid and eyebrow output."
next_calib_lids_brows_tip = "Durante la calibración inteligente de NEXT, calibra también párpados y cejas. Tu cara se mantiene neutra durante toda la secuencia de puntos, así que esos fotogramas capturan tus valores en reposo: los párpados se fijan en 0,75 (abiertos con normalidad) y las cejas en 0,5 (neutras), mientras que totalmente cerrado y totalmente abierto/levantado no cambian. Desactívalo para enviar la salida sin procesar del modelo."
# EN: "Dominant"
next_dominant_eye = "Dominante"
# EN: "Left"
next_dominant_eye_left = "Izquierdo"
# EN: "Right"
next_dominant_eye_right = "Derecho"
# EN: "Your dominant (fixating) eye, the one that looks straight at what you focus on. Dominant eye mode follows it, and in both per-eye modes Smart Calib and recenter are taken from it and applied to both eyes."
next_dominant_eye_tip = "Tu ojo dominante (el que fija), el que mira directamente a lo que enfocas. El modo de ojo dominante lo sigue, y en los dos modos por ojo la calibración inteligente y el recentrado se toman de él y se aplican a ambos ojos."
# EN: "NEXT gaze"
next_gaze_mode = "Mirada NEXT"
# EN: "Dominant eye"
next_gaze_mode_dominant = "Ojo dominante"
# EN: "Fused"
next_gaze_mode_fused = "Fusionada"
# EN: "Independent"
next_gaze_mode_independent = "Independiente"
# EN: "What your avatar's eyes follow. Fused (default): one shared gaze read from both cameras, the steadiest choice when your eyes point together. Independent: each avatar eye follows its own eye, so a crossed or lazy eye shows as it really is. Dominant eye: both avatar eyes follow the eye picked next to this, for accurate gaze without showing the deviation. The per-eye modes need the shared NEXT model; in them Smart Calib and recenter use the dominant eye only, so they keep your real deviation. Re-run NEXT Smart Calib after changing this."
next_gaze_mode_tip = "Lo que siguen los ojos de tu avatar. Fusionada (predeterminado): una mirada compartida leída de ambas cámaras, la opción más estable si tus ojos apuntan juntos. Independiente: cada ojo del avatar sigue su propio ojo, así que un ojo desviado o vago se muestra tal como es. Ojo dominante: ambos ojos del avatar siguen el ojo elegido junto a esta opción, para una mirada precisa sin mostrar la desviación. Los modos por ojo requieren el modelo NEXT compartido; en ellos la calibración inteligente y el recentrado usan solo el ojo dominante, por lo que conservan tu desviación real. Vuelve a ejecutar la calibración inteligente de NEXT después de cambiar esto."
# EN: "Eyelid L/R Sync"
next_lid_sync = "Sinc. I/D de párpados"
# EN: "Keeps your two eyelids reading the same while your face is neutral, so one eyelid does not wander on its own while you look around. Small left/right differences are averaged; clear ones like a wink or a one-sided squint come through as tracked. Higher = held together over larger differences. 0 = off. Needs both eyes on the shared NEXT model."
next_lid_sync_tip = "Mantiene ambos párpados iguales mientras tu cara está neutra, para que un párpado no se mueva por su cuenta al mirar alrededor. Las pequeñas diferencias entre izquierda y derecha se promedian; las claras, como un guiño o entrecerrar un solo ojo, pasan tal como se detectan. Más alto = se mantienen juntos con diferencias mayores. 0 = desactivado. Requiere ambos ojos en el modelo NEXT compartido."

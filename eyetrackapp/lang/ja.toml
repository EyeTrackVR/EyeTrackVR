# EN: "For Direct3D 11 SteamVR games without their own foveated rendering: adds it with PimaxMagic4All, so the game renders sharp only where you look. Games with built-in eye-tracked foveated rendering, and OpenXR games using Quad-Views-Foveated, already get your gaze from \"Foveated rendering gaze\" and don't need this. Remembered per game; turn it on before starting the game."

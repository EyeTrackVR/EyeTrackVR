method_tip = "このゲームがフォービエイテッドレンダリングを得る方式です。自動では、既知のゲームの一覧とゲームが使用しているものから選びます: Direct3D 11 の SteamVR ゲームには PimaxMagic4All、内蔵しているゲームや OpenXR ゲーム (クアッドビュー) には追加不要です。自動の選択がこのゲームに合わない場合のみ変更してください。"

[osc]
# EN: "VRC Native"
mode_native = "VRC ネイティブ"
# EN: "Send eye data over VRChat's built-in OSC parameters. Use for avatars wired to the native eye-look params (no extra mod required)."
mode_native_tip = "VRChat 組み込みの OSC パラメーターで目のデータを送信します。ネイティブの視線パラメーターに接続されたアバター向けです (追加の Mod は不要)。"
# EN: "VRCFT (v2)"
mode_vrcft_v2 = "VRCFT (v2)"
# EN: "Send via VRCFaceTracking v2 params (current). Required for VRCFT-based avatars and facial-tracking add-ons."
mode_vrcft_v2_tip = "VRCFaceTracking v2 パラメーター (現行) で送信します。VRCFT ベースのアバターやフェイストラッキングのアドオンに必要です。"
# EN: "Receive"
receive = "受信"
# EN: "Listen for incoming OSC messages from VRChat (e.g. calibration toggles from in-game)."
receive_tip = "VRChat からの受信 OSC メッセージ (例: ゲーム内からのキャリブレーション切り替え) を待ち受けます。"
# EN: "Auto port (OSCQuery)"
oscquery = "自動ポート (OSCQuery)"
# EN: "Let VRChat find the receiver automatically (OSCQuery) instead of using the fixed Receiver Port, so it can run alongside VRCFaceTracking and other OSC apps. Same PC as VRChat only; falls back to the Receiver Port if it can't start."
oscquery_tip = "固定の受信ポートの代わりに、VRChat が受信側を自動で見つけます (OSCQuery)。VRCFaceTracking など他の OSC アプリと同時に使えます。VRChat と同じ PC のみ対応で、起動できない場合は受信ポートを使用します。"
foveation_gaze = "フォービエイテッドレンダリング用視線"
foveation_gaze_tip = "この PC のフォービエイテッドレンダリングツールにも視線を共有します: PimaxMagic4All (UDP ポート 9020) と、EyeTrackVR の視線共有メモリを読む連携機能。どの出力モードでも使えます。 EyeTrackVR の SteamVR ドライバーと OpenXR レイヤーも設定し、どのヘッドセットでも SteamVR・Monado・WiVRn などのランタイムで OpenXR ゲームが視線を使えるようにします (変更後は SteamVR とゲームを再起動してください)。"
# EN: "Only one version of VRCFT params can be turned on"
err_one_vrcft_version = "VRCFT パラメーターは 1 つのバージョンのみ有効にできます"
# EN: "Either VRCNative or VRCFT output can be active at a time"
err_output_mode_conflict = "VRCNative と VRCFT の出力は同時に一方しか有効にできません"
# EN: "pyVRCFT (beta)"
mode_pyvrcft = "pyVRCFT (ベータ)"
# EN: "Beta: send Unified Expressions straight to VRChat using the built-in PY-VRCFT port — no VRCFaceTracking app or module needed. Auto-detects the avatar (OSCQuery/mDNS) and its declared FT params. Replaces VRCFT; don't run both. Uses the OSC send/receive ports below."
mode_pyvrcft_tip = "ベータ: 内蔵のPY-VRCFTポートを使ってUnified ExpressionsをVRChatへ直接送信します。VRCFaceTrackingアプリやモジュールは不要です。アバター(OSCQuery/mDNS)と宣言されたFTパラメーターを自動検出します。VRCFTの代わりになるため、同時に実行しないでください。下のOSC送受信ポートを使用します。"


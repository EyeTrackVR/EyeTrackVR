[oneeuro]
# EN: "Smoothing Intensity"
smoothing_intensity = "スムージング強度"
# EN: "How aggressively the One-Euro filter smooths eye motion. 0 = almost no smoothing (snappiest, jitter passes through), 100 = very heavy smoothing (laggy but rock-steady). Default 70 matches the historical balanced setting."
smoothing_intensity_tip = "One-Euro フィルターが目の動きをどれだけ強くスムージングするか。0 = ほぼスムージングなし (最も俊敏だが、揺れがそのまま通る)、100 = 非常に強いスムージング (遅延するが極めて安定)。デフォルトの 70 は従来のバランス設定に相当します。"


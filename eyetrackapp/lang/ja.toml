next_calib_lids_brows_tip = "NEXTスマートキャリブ中に、まぶたと眉も調整します。ドットの表示中は表情がニュートラルなので、その映像から安静時の値を取得します。まぶたは0.75(通常の開き)、眉は0.5(ニュートラル)に合わせ、完全に閉じた状態と完全に開いた/上げた状態は変更しません。オフにするとモデルのまぶたと眉の出力をそのまま送信します。"

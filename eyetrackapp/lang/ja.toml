setup_bad_download = "ダウンロードしたものが想定した PimaxMagic4All のリリースではなかったため、何もインストールしていません。後でもう一度試すか、手持ちのコピーを使ってください。"
# EN: "PimaxMagic4All could not be saved on this PC. If a game is running with foveated rendering, close it and try again."

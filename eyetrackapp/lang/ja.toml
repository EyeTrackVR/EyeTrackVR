next_lid_sync_tip = "表情がニュートラルなときに左右のまぶたの値をそろえ、周囲を見ている間に片方のまぶただけが動かないようにします。左右の小さな差は平均され、ウィンクや片目だけの目細めのようなはっきりした差はそのまま反映されます。高いほど大きな差までそろえます。0 = オフ。両目が共有NEXTモデルを使用している必要があります。"
# EN: "Hold vertical gaze when squinting"
next_squint_y_hold = "目を細めたときに上下の視線を保持"

next_brow_sync_tip = "表情がニュートラルなときに左右の眉の値をそろえます。左右の小さな差は平均され、片方の眉をはっきり上げた動きはそのまま反映されます。高いほど大きな差までそろえ、低いほど小さな片側の動きも残します。0 = オフ。両目が共有NEXTモデルを使用している必要があります。"

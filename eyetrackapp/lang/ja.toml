# EN: "Please ensure your cameras are well lit, focused, rotated and cropped correctly. Please ask in our discord for assistance if needed. We are here to help!"
body_issues = "カメラが十分に明るく、ピントが合い、正しく回転・クロップされていることを確認してください。必要であれば Discord でお気軽にご質問ください。私たちがお手伝いします！"
# EN: "Improve your experience"
header_improve = "体験を向上させる"
# EN: "Please consider contributing data to our training to improve future models for much better tracking and features. It only takes a few minutes. Every submission helps and we really want data on setups that work poorly, as well as ones that work well. Thank you!"
body_improve = "今後のモデルを改善し、より優れたトラッキングと機能を実現するため、トレーニング用のデータ提供をぜひご検討ください。ほんの数分で済みます。すべての送信が役立ちます。うまく動作するセットアップだけでなく、うまく動作しないセットアップのデータも大歓迎です。ありがとうございます！"

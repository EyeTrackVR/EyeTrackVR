next_squint_y_hold_tip = "目を細めたときに視線が勝手に上下に動く場合にオンにします。目が閉じていくと、上下の視線はまぶたに追従せず、最後の安定した位置へ移ります。長く目を細めている場合はゆっくり追従します。左右の視線には影響しません。デフォルトはオフです。"

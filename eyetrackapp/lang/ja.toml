model_size_tip = "トラッキング品質と速度のバランスを選びます。Normal が既定で、ほとんどの PC に適しています。右に動かすほど大きく少し高精度なモデルになり、計算量も増えます: Large、次に XL (XL は ETVR と BSB のみ。PSVR は Large を使用)。左端の Lite は Normal の半精度版です。"

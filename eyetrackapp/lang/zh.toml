# EN: "Model Size"
model_size = "模型大小"
# EN: "Trade tracking quality for speed. Normal is the default and fits most PCs. Moving right picks a larger model that tracks a bit better and uses more compute: Large, then XL (XL is ETVR and BSB only; PSVR uses Large). Lite, at the far left, is Normal at half precision."
model_size_tip = "在追踪质量与速度之间取舍。Normal 为默认值，适合大多数电脑。向右移动会选择更大的模型，追踪略好但计算量更大：Large，然后是 XL（XL 仅限 ETVR 和 BSB；PSVR 使用 Large）。最左侧的 Lite 是半精度的 Normal。"
